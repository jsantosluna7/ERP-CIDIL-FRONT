<mat-dialog-content>
  <form class="formulario">
    <mat-form-field class="total">
      <mat-label>Estado</mat-label>
      <mat-select>
        <mat-option>None</mat-option>
        <mat-option value="option1">Option 1</mat-option>
        <mat-option value="option2">Option 2</mat-option>
        <mat-option value="option3">Option 3</mat-option>
      </mat-select>
    </mat-form-field>

    <mat-form-field class="total">
      <mat-label>Evento</mat-label>
      <textarea
        matInput
        #message
        maxlength="256"
        placeholder="Cuenta lo que pasa con la Orden, Ej. La orden presenta..."
      ></textarea>
      <mat-hint align="end">{{ message.value.length }} / 256</mat-hint>
    </mat-form-field>
  </form>
</mat-dialog-content>
<mat-dialog-actions>
  <button mat-raised-button (click)="onNoCancelar()">Cancelar</button>
  <button
    mat-raised-button
    [mat-dialog-close]="onSiActualizar()"
    cdkFocusInitial
  >
    Ok
  </button>
</mat-dialog-actions>
