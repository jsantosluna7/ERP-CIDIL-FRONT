<div class="scene">
  <div class="card">
    <div class="head">
      <h1>Restablecer <b>contraseña</b></h1>
      <p class="sub">Establece una nueva contraseña.</p>
    </div>

    <form [formGroup]="form" (ngSubmit)="onSubmit()">
      <div class="field">
        <div class="label-row">
          <label for="pass">Contraseña</label>
          @if (hasError("password")) {
            <span class="error-icon" tabindex="0">
              i
              <span class="tooltip">{{ errorMessage("password") }}</span>
            </span>
          }
        </div>
        <div class="input-shell" [class.has-error]="hasError('password')">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
          >
            <rect x="4" y="10" width="16" height="10" rx="2" />
            <path d="M8 10V7a4 4 0 0 1 8 0v3" />
          </svg>
          <input
            id="pass"
            type="password"
            placeholder="••••••••"
            autocomplete="new-password"
            formControlName="password"
          />
        </div>
      </div>

      <div class="field">
        <div class="label-row">
          <label for="pass2">Confirmar contraseña</label>
          @if (hasError("confirmPassword")) {
            <span class="error-icon" tabindex="0">
              i
              <span class="tooltip">{{ errorMessage("confirmPassword") }}</span>
            </span>
          }
        </div>
        <div
          class="input-shell"
          [class.has-error]="hasError('confirmPassword')"
        >
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
          >
            <rect x="4" y="10" width="16" height="10" rx="2" />
            <path d="M8 10V7a4 4 0 0 1 8 0v3" />
          </svg>
          <input
            id="pass2"
            type="password"
            placeholder="••••••••"
            autocomplete="new-password"
            formControlName="confirmPassword"
          />
        </div>
      </div>

      <button type="submit" class="cta" [disabled]="loading">
        @if (loading) {
          <span class="spinner" aria-hidden="true"></span>
          Guardando...
        } @else {
          Recuperar contraseña
        }
      </button>
    </form>
  </div>
</div>
