<div class="scene">
  <div class="card">
    <div class="head">
      <h1>Restablecer <b>contraseña</b></h1>
      <p class="sub">Establece una nueva contraseña.</p>
    </div>

    <form [formGroup]="resetForm" (ngSubmit)="onSubmit()">
      <div class="field">
        <label for="email">Email</label>
        <div class="input-shell">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
          >
            <rect x="3" y="5" width="18" height="14" rx="2" />
            <path d="m3 7 9 6 9-6" />
          </svg>
          <input
            id="email"
            type="email"
            formControlName="email"
            placeholder="ejemplo@ipl.edu.do"
            autocomplete="email"
          />
        </div>
      </div>

      <button type="submit" class="cta" [disabled]="loading">
        @if (loading) {
          <span class="spinner" aria-hidden="true"></span>
          Enviar correo...
        } @else {
          Enviar correo
        }
      </button>
    </form>

    <p class="login-note">
      ¿Recordaste tu contraseña? <a routerLink="/acceso/login">Inicia sesión</a>
    </p>
  </div>
</div>
